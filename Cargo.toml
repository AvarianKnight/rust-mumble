[package]
name = "rust-mumble"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.9.3"
anyhow = "1.0.104"
bytes = "1.12.1"
byteorder = "1.5.0"
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
futures-util = "0.3.34"
lazy_static = "1.5.1"
protobuf = "3.7.2"
ring = "0.17.14"
rustls = { version = "0.23.46", features = ["ring", "tls12"], default-features = false }
rustls-pemfile = "2.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full", "tracing"] }
tokio-byteorder = "0.3.0"
tokio-rustls = { version = "0.26.6", features = ["ring", "tls12"], default-features = false}
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
prometheus = { version  = "0.14.0", features = ["process"] }
rustls-pki-types = "1.15.1"
rcgen = { version = "0.14.10" }
scc = "3.8.8"
parking_lot = "0.13.0"
arc-swap = "1.9.3"
crossbeam = "0.8.5"
axum = { version = "0.8.9", features = ["macros"] }
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
axum-auth = "0.8.1"
tokio-util = "0.7.20"
regex = "1.13.1"
atomic_float = "1.1.0"
socket2 = { version = "0.6.5", features = ["all"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
tikv-jemallocator = "0.7"

[profile.release]
codegen-units = 1
lto = true
#debug = 1
panic = "abort"
